# scripted/written by Robert Bopko (github.com/zeroznet) with Boba Bott (Claude Opus 5.5)

name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-26.04
    steps:
      # Major tag instead of a SHA pin: no dependency bot runs on this repo,
      # and the job only reads the checkout and holds no secrets.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dash, shellcheck and nftables
        run: |
          set -eu
          sudo apt-get update -q
          sudo apt-get install -y -q dash nftables shellcheck

      - name: shellcheck
        run: shellcheck -s sh dropshit.sh

      # Cron runs it as /usr/local/sbin/dropshit under dash on Debian, so dash parsing is the gate.
      - name: Syntax
        run: dash -n dropshit.sh

      # A full run rewrites the firewall, so --print builds the ruleset from the fixture and nft -c only checks it.
      - name: Ruleset check
        run: |
          set -eu
          dash dropshit.sh --print < test/fixture.txt > dropshit.nft 2> warn.txt
          grep -q 'not-an-address' warn.txt
          sudo nft -c -f dropshit.nft

      - name: Help smoke run
        run: |
          set -eu
          dash dropshit.sh --help >/dev/null
          if dash dropshit.sh --bogus >/dev/null 2>&1; then
            echo "::error::unknown flag was accepted"
            exit 1
          fi
